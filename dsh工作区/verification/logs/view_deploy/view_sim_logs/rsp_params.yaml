robot_state_publisher:
  ros__parameters:
    robot_description: "<?xml version=\"1.0\"?>\n<!--\n  Zhirong Cup omnidirectional\
      \ robot - minimalist primitive-geometry URDF\n  ======================================================================\n\
      \  Coordinate convention:\n    +X : forward (depth camera side)\n    +Y : left\n\
      \    +Z : up\n    base_footprint : ground projection of the robot centre\n \
      \   base_link      : geometric centre of the cylindrical body\n\n  Key dimensions\
      \ (metres):\n    body cylinder          radius 0.250, height 0.200\n    body\
      \ bottom / top      z = 0.140 / 0.340\n    wheel                  radius 0.065,\
      \ width 0.040\n    wheel centres          x = +-0.170, y = +-0.170, z = 0.065\n\
      \    Livox Mid-360          65 x 65 x 60 mm, on body top centre\n    depth camera\
      \ (D435i)   90 x 25 x 25 mm, front face of body\n  ======================================================================\n\
      -->\n<robot name=\"zhirong_omni_robot\">\n\n  <!-- ======================= materials\
      \ ======================= -->\n  <material name=\"body_gray\">\n    <color rgba=\"\
      0.76 0.79 0.83 1.0\"/>\n  </material>\n  <material name=\"accent_orange\">\n\
      \    <color rgba=\"0.95 0.45 0.10 1.0\"/>\n  </material>\n  <material name=\"\
      wheel_black\">\n    <color rgba=\"0.09 0.09 0.10 1.0\"/>\n  </material>\n  <material\
      \ name=\"hub_gray\">\n    <color rgba=\"0.45 0.47 0.50 1.0\"/>\n  </material>\n\
      \  <material name=\"wheel_plate\">\n    <color rgba=\"0.22 0.23 0.25 1.0\"/>\n\
      \  </material>\n  <material name=\"roller_gray\">\n    <color rgba=\"0.40 0.41\
      \ 0.44 1.0\"/>\n  </material>\n  <material name=\"lidar_black\">\n    <color\
      \ rgba=\"0.05 0.05 0.06 1.0\"/>\n  </material>\n  <material name=\"lidar_blue\"\
      >\n    <color rgba=\"0.04 0.28 0.60 1.0\"/>\n  </material>\n  <material name=\"\
      lidar_silver\">\n    <color rgba=\"0.68 0.70 0.73 1.0\"/>\n  </material>\n \
      \ <material name=\"camera_dark\">\n    <color rgba=\"0.15 0.16 0.18 1.0\"/>\n\
      \  </material>\n  <material name=\"lens_blue\">\n    <color rgba=\"0.08 0.20\
      \ 0.50 1.0\"/>\n  </material>\n\n  <!-- ======================= chassis =======================\
      \ -->\n  <!-- base_footprint 是地面投影参考系，故意不给 <inertial>：\n       1) robot_state_publisher\
      \ 用 KDL 解析 URDF，KDL 不支持「根 link 带惯性」\n          （会打印 The root link base_footprint\
      \ has an inertia ... 警告）；\n       2) Gazebo Classic 的 URDF->SDF 转换会把固定关节子 link（base_link）的\n\
      \          质量/惯性 lumped 进根 link，base_footprint 没惯性也能正常仿真\n          （已实测 spawn\
      \ 无报错、落地高度正确）。\n       这也是 URDF/RViz 侧的既有约定，不要为了 Gazebo 在这里加惯性。 -->\n  <link\
      \ name=\"base_footprint\"/>\n\n  <link name=\"base_link\">\n    <inertial>\n\
      \      <origin xyz=\"0 0 0\" rpy=\"0 0 0\"/>\n      <mass value=\"8.0\"/>\n\
      \      <!-- solid cylinder: Ixx=Iyy=m(3r^2+h^2)/12, Izz=m r^2/2 -->\n      <inertia\
      \ ixx=\"0.1516667\" ixy=\"0.0\" ixz=\"0.0\"\n               iyy=\"0.1516667\"\
      \ iyz=\"0.0\" izz=\"0.25\"/>\n    </inertial>\n\n    <visual>\n      <origin\
      \ xyz=\"0 0 0\" rpy=\"0 0 0\"/>\n      <geometry>\n        <cylinder radius=\"\
      0.25\" length=\"0.20\"/>\n      </geometry>\n      <material name=\"body_gray\"\
      />\n    </visual>\n\n    <!-- thin orange accent band, purely cosmetic -->\n\
      \    <visual>\n      <origin xyz=\"0 0 0.075\" rpy=\"0 0 0\"/>\n      <geometry>\n\
      \        <cylinder radius=\"0.2515\" length=\"0.025\"/>\n      </geometry>\n\
      \      <material name=\"accent_orange\"/>\n    </visual>\n\n    <collision>\n\
      \      <origin xyz=\"0 0 0\" rpy=\"0 0 0\"/>\n      <geometry>\n        <cylinder\
      \ radius=\"0.25\" length=\"0.20\"/>\n      </geometry>\n    </collision>\n \
      \ </link>\n\n  <joint name=\"base_footprint_joint\" type=\"fixed\">\n    <parent\
      \ link=\"base_footprint\"/>\n    <child link=\"base_link\"/>\n    <origin xyz=\"\
      0 0 0.24\" rpy=\"0 0 0\"/>\n  </joint>\n\n  <!-- ======================= wheels\
