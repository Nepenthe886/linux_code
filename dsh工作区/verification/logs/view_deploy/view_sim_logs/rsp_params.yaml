      />\n    <dynamics damping=\"0.01\" friction=\"0.01\"/>\n  </joint>\n\n  <!--\
      \ ======================= Livox Mid-360 =======================\n       Link\
      \ frame: centre of the mounting face (top of the body).\n       Device: 65 x\
      \ 65 x 60 mm, weight 265 g.\n       Open-source STL device 60 mm -> top of lidar\
      \ at z = 0.400.\n  ===============================================================\
      \ -->\n  <link name=\"livox_mid360_link\">\n    <inertial>\n      <origin xyz=\"\
      0 0 0.030\" rpy=\"0 0 0\"/>\n      <mass value=\"0.265\"/>\n      <!-- box approximation\
      \ of the 65 x 65 x 60 mm device -->\n      <inertia ixx=\"0.0001727\" ixy=\"\
      0.0\" ixz=\"0.0\"\n               iyy=\"0.0001727\" iyz=\"0.0\" izz=\"0.0001866\"\
      />\n    </inertial>\n\n    <!-- Open-source Livox Mid-360 STL (MIT). The model\
      \ is split by material:\n         silver heat-sink base, blue dome, black top\
      \ cap. -->\n    <visual>\n      <origin xyz=\"0 0 0\" rpy=\"0 0 0\"/>\n    \
      \  <geometry>\n        <mesh filename=\"model://robot_description/meshes/mid360_base.stl\"\
      />\n      </geometry>\n      <material name=\"lidar_silver\"/>\n    </visual>\n\
      \    <visual>\n      <origin xyz=\"0 0 0\" rpy=\"0 0 0\"/>\n      <geometry>\n\
      \        <mesh filename=\"model://robot_description/meshes/mid360_dome.stl\"\
      />\n      </geometry>\n      <material name=\"lidar_blue\"/>\n    </visual>\n\
      \    <visual>\n      <origin xyz=\"0 0 0\" rpy=\"0 0 0\"/>\n      <geometry>\n\
      \        <mesh filename=\"model://robot_description/meshes/mid360_top.stl\"\
      />\n      </geometry>\n      <material name=\"lidar_black\"/>\n    </visual>\n\
      \n    <collision>\n      <origin xyz=\"0 0 0.030\" rpy=\"0 0 0\"/>\n      <geometry>\n\
      \        <box size=\"0.065 0.065 0.060\"/>\n      </geometry>\n    </collision>\n\
      \  </link>\n  <joint name=\"livox_mid360_joint\" type=\"fixed\">\n    <parent\
      \ link=\"base_link\"/>\n    <child link=\"livox_mid360_link\"/>\n    <origin\
      \ xyz=\"0 0 0.10\" rpy=\"0 0 0\"/>\n  </joint>\n\n  <!-- =======================\
      \ depth camera =======================\n       Intel RealSense D435i style:\
      \ 90 x 25 x 25 mm.\n       Body centre at x = 0.263 (back face 0.2505), z =\
      \ 0.270.\n       camera_link  : x forward, y left, z up (body axes)\n      \
      \ camera_optical_frame : z forward, x right, y down (REP-103)\n  ===============================================================\
      \ -->\n  <link name=\"camera_link\">\n    <inertial>\n      <origin xyz=\"0\
      \ 0 0\" rpy=\"0 0 0\"/>\n      <mass value=\"0.09\"/>\n      <!-- box 0.025\
      \ x 0.090 x 0.025 -->\n      <inertia ixx=\"0.0000654\" ixy=\"0.0\" ixz=\"0.0\"\
      \n               iyy=\"0.0000094\" iyz=\"0.0\" izz=\"0.0000654\"/>\n    </inertial>\n\
      \n    <visual>\n      <origin xyz=\"0 0 0\" rpy=\"0 0 0\"/>\n      <geometry>\n\
      \        <box size=\"0.025 0.090 0.025\"/>\n      </geometry>\n      <material\
      \ name=\"camera_dark\"/>\n    </visual>\n\n    <!-- dark front glass -->\n \
      \   <visual>\n      <origin xyz=\"0.0135 0 0\" rpy=\"0 0 0\"/>\n      <geometry>\n\
      \        <box size=\"0.002 0.074 0.018\"/>\n      </geometry>\n      <material\
      \ name=\"lens_blue\"/>\n    </visual>\n\n    <!-- three lenses: left IR / RGB\
      \ / right IR (dark ring + blue glass) -->\n    <visual>\n      <origin xyz=\"\
      0.0160 -0.031 0\" rpy=\"0 1.57079632679 0\"/>\n      <geometry>\n        <cylinder\
      \ radius=\"0.0070\" length=\"0.003\"/>\n      </geometry>\n      <material name=\"\
      camera_dark\"/>\n    </visual>\n    <visual>\n      <origin xyz=\"0.0170 -0.031\
      \ 0\" rpy=\"0 1.57079632679 0\"/>\n      <geometry>\n        <cylinder radius=\"\
      0.0050\" length=\"0.003\"/>\n      </geometry>\n      <material name=\"lens_blue\"\
      />\n    </visual>\n    <visual>\n      <origin xyz=\"0.0160 0.000 0\" rpy=\"\
      0 1.57079632679 0\"/>\n      <geometry>\n        <cylinder radius=\"0.0070\"\
      \ length=\"0.003\"/>\n      </geometry>\n      <material name=\"camera_dark\"\
      />\n    </visual>\n    <visual>\n      <origin xyz=\"0.0170 0.000 0\" rpy=\"\
      0 1.57079632679 0\"/>\n      <geometry>\n        <cylinder radius=\"0.0050\"\
      \ length=\"0.003\"/>\n      </geometry>\n      <material name=\"lens_blue\"\
      />\n    </visual>\n    <visual>\n      <origin xyz=\"0.0160 0.031 0\" rpy=\"\
      0 1.57079632679 0\"/>\n      <geometry>\n        <cylinder radius=\"0.0070\"\
      \ length=\"0.003\"/>\n      </geometry>\n      <material name=\"camera_dark\"\
      />\n    </visual>\n    <visual>\n      <origin xyz=\"0.0170 0.031 0\" rpy=\"\
      0 1.57079632679 0\"/>\n      <geometry>\n        <cylinder radius=\"0.0050\"\
      \ length=\"0.003\"/>\n      </geometry>\n      <material name=\"lens_blue\"\
      />\n    </visual>\n\n    <collision>\n      <origin xyz=\"0 0 0\" rpy=\"0 0\
      \ 0\"/>\n      <geometry>\n        <box size=\"0.025 0.090 0.025\"/>\n     \
      \ </geometry>\n    </collision>\n  </link>\n  <joint name=\"camera_joint\" type=\"\
      fixed\">\n    <parent link=\"base_link\"/>\n    <child link=\"camera_link\"\
      />\n    <origin xyz=\"0.263 0 0.03\" rpy=\"0 0 0\"/>\n  </joint>\n\n  <link\
      \ name=\"camera_optical_frame\"/>\n  <joint name=\"camera_optical_joint\" type=\"\
      fixed\">\n    <parent link=\"camera_link\"/>\n    <child link=\"camera_optical_frame\"\
      />\n    <origin xyz=\"0.0185 0 0\" rpy=\"-1.57079632679 0 -1.57079632679\"/>\n\
      \  </joint>\n\n  <!-- ==================================================================\n\
      \       Gazebo Classic 11 集成（仅 Gazebo 使用，不影响 RViz 显示结构）\n       ··································································\n\
      \       插件（ModelPlugin，写在 robot 级 <gazebo> 里）：\n         * libgazebo_ros_planar_move.so\n\
      \             速度级平面运动：订阅 /cmd_vel(Twist)，发布 /odom 与\n             TF odom->base_footprint。参数名已按\
      \ gazebo_ros 3.9 插件源码 /\n             gazebo_plugins 自带 demo world 核实：\n   \
      \          update_rate / publish_rate / publish_odom / publish_odom_tf /\n \
      \            odometry_frame / robot_base_frame / covariance_x|y|yaw。\n     \
      \    * libgazebo_ros_joint_state_publisher.so\n             发布四个轮关节的 /joint_states（update_rate\
      \ + 每个 joint_name）。\n       注意：libgazebo_ros_init.so / libgazebo_ros_factory.so\
      \ 是 SystemPlugin，\n       必须由 gzserver 命令行 -s 加载（见 launch/gazebo.launch.py），不能写在这里。\n\
      \       ================================================================== -->\n\
      \n  <!-- 材质：Gazebo 不解析 URDF 顶部的 <material> 名字，需要逐 link 指定。\n       self_collide\
      \ 保持 false（与 URDF 默认一致），避免轮子与底盘自碰撞。 -->\n  <gazebo reference=\"base_link\">\n\
      \    <material>Gazebo/Grey</material>\n    <self_collide>false</self_collide>\n\
      \  </gazebo>\n\n  <!-- 四个麦轮：planar_move 直接设置车体速度，轮子碰撞体不应与地面大力摩擦，\n       否则接触约束会和速度指令打架产生抖动/漂移；统一调低摩擦系数。\n\
      \       轮子由关节状态发布器以 passive 关节形式驱动，不含电机模型。 -->\n  <gazebo reference=\"wheel_front_left_link\"\
      >\n    <material>Gazebo/FlatBlack</material>\n    <mu1>0.1</mu1>\n    <mu2>0.1</mu2>\n\
      \    <self_collide>false</self_collide>\n  </gazebo>\n  <gazebo reference=\"\
      wheel_front_right_link\">\n    <material>Gazebo/FlatBlack</material>\n    <mu1>0.1</mu1>\n\
      \    <mu2>0.1</mu2>\n    <self_collide>false</self_collide>\n  </gazebo>\n \
      \ <gazebo reference=\"wheel_rear_left_link\">\n    <material>Gazebo/FlatBlack</material>\n\
      \    <mu1>0.1</mu1>\n    <mu2>0.1</mu2>\n    <self_collide>false</self_collide>\n\
      \  </gazebo>\n  <gazebo reference=\"wheel_rear_right_link\">\n    <material>Gazebo/FlatBlack</material>\n\
      \    <mu1>0.1</mu1>\n    <mu2>0.1</mu2>\n    <self_collide>false</self_collide>\n\
      \  </gazebo>\n\n  <gazebo reference=\"livox_mid360_link\">\n    <material>Gazebo/DarkGrey</material>\n\
      \    <self_collide>false</self_collide>\n  </gazebo>\n  <gazebo reference=\"\
      camera_link\">\n    <material>Gazebo/FlatBlack</material>\n    <self_collide>false</self_collide>\n\
      \  </gazebo>\n  <gazebo reference=\"camera_optical_frame\">\n    <self_collide>false</self_collide>\n\
      \  </gazebo>\n\n  <!-- 底盘速度级运动 + 里程计 / TF（odom -> base_footprint）。\n       /wheel_cmd\
      \ 在本模式下不参与：teleop 发的 /cmd_vel 直接驱动车体。 -->\n  <gazebo>\n    <plugin name=\"gazebo_ros_planar_move\"\
      \ filename=\"libgazebo_ros_planar_move.so\">\n      <ros>\n        <namespace>/</namespace>\n\
      \      </ros>\n      <update_rate>50.0</update_rate>\n      <publish_rate>50.0</publish_rate>\n\
      \      <publish_odom>true</publish_odom>\n      <publish_odom_tf>true</publish_odom_tf>\n\
      \      <odometry_frame>odom</odometry_frame>\n      <robot_base_frame>base_footprint</robot_base_frame>\n\
      \      <covariance_x>0.0001</covariance_x>\n      <covariance_y>0.0001</covariance_y>\n\
      \      <covariance_yaw>0.01</covariance_yaw>\n    </plugin>\n  </gazebo>\n\n\
      \  <!-- 轮关节状态：robot_state_publisher 需要 /joint_states 才能生成轮子 TF -->\n  <gazebo>\n\
      \    <plugin name=\"gazebo_ros_joint_state_publisher\"\n            filename=\"\
      libgazebo_ros_joint_state_publisher.so\">\n      <ros>\n        <namespace>/</namespace>\n\
      \      </ros>\n      <update_rate>50.0</update_rate>\n      <joint_name>wheel_front_left_joint</joint_name>\n\
      \      <joint_name>wheel_front_right_joint</joint_name>\n      <joint_name>wheel_rear_left_joint</joint_name>\n\
      \      <joint_name>wheel_rear_right_joint</joint_name>\n    </plugin>\n  </gazebo>\n\
      \n</robot>\n"
